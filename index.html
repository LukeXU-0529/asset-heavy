<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Asset Heavy · 产业产能地图</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --ink: #152337; --muted: #52647b; --line: #dbe4ee; --active: #e7efff; --accent: #154cb4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121c2a; --ink: #eef4ff; --muted: #b8c6da; --line: #324156; --active: #213959; --accent: #a5c7ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--bg); color: var(--ink); font: 14px system-ui, 'Microsoft YaHei', sans-serif; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 26px; padding: 8px clamp(12px, 3vw, 48px); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 800; letter-spacing: .02em; }
    .brand span { margin-inline-start: 8px; color: var(--muted); font-weight: 500; }
    nav { display: flex; flex-wrap: wrap; gap: 4px; }
    nav a { padding: 7px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 650; }
    nav a[aria-current] { background: var(--active); color: var(--accent); }
    nav a:hover { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main { min-height: 0; }
    iframe { width: 100%; height: 100%; display: block; border: 0; }
    iframe[hidden] { display: none; }
    @media (max-width: 460px) { header { gap: 4px 10px; } .brand span { display: none; } nav a { padding-inline: 8px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Asset Heavy<span>产业产能地图</span></div>
    <nav aria-label="切换产业链"></nav>
  </header>
  <main id="chain-content">
    <noscript><p>请选择 <a href="pcb.html?view=1&amp;tab=dashboard">PCB 产业链</a> 或 <a href="fab.html">Fab 与封测</a> 或 <a href="fab.html?scope=overseas">Fab · 海外</a>。</p></noscript>
  </main>
  <script type="module">
    const chains = [
      { id: 'pcb', label: 'PCB 产业链', page: 'pcb.html', forwardQuery: true },
      { id: 'fab', label: 'Fab 与封测', page: 'fab.html' },
      { id: 'fab-overseas', label: 'Fab · 海外', page: 'fab.html?scope=overseas', frameId: 'fab' },
    ];

    const nav = document.querySelector('nav');
    const content = document.querySelector('#chain-content');
    const frames = new Map();
    const links = new Map();

    function chainUrl(id) {
      const url = new URL(location.href);
      if (id === chains[0].id) url.searchParams.delete('chain');
      else url.searchParams.set('chain', id);
      return url;
    }

    function showChain() {
      const requested = new URLSearchParams(location.search).get('chain');
      const chain = chains.find(({ id }) => id === requested) ?? chains[0];
      const source = new URL(chain.page, location.href);
      if (chain.forwardQuery) {
        source.search = location.search;
        source.searchParams.delete('chain');
        if (!source.searchParams.has('view')) source.searchParams.set('view', '1');
        if (!source.searchParams.has('tab')) source.searchParams.set('tab', 'dashboard');
        source.hash = location.hash;
      }

      const frameId = chain.frameId ?? chain.id;
      let frame = frames.get(frameId);
      if (!frame || (frameId === 'fab' && frame.src !== source.href)) {
        const previous = frame;
        frame = document.createElement('iframe');
        frame.src = source.href;
        if (previous) previous.replaceWith(frame);
        else content.append(frame);
        frames.set(frameId, frame);
      }
      frame.title = chain.label;
      if (frame.src !== source.href) frame.src = source.href;
      for (const [id, element] of frames) element.hidden = id !== frameId;
      for (const [id, link] of links) {
        link.href = chainUrl(id);
        if (id === chain.id) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
    }

    for (const { id, label } of chains) {
      const link = document.createElement('a');
      link.textContent = label;
      link.addEventListener('click', (event) => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        if (link.hasAttribute('aria-current')) return;
        history.pushState(null, '', chainUrl(id));
        showChain();
      });
      links.set(id, link);
      nav.append(link);
    }
    addEventListener('popstate', showChain);
    showChain();
  </script>
</body>
</html>
